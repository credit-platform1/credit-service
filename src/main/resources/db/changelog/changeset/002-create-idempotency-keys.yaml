databaseChangeLog:
  - changeSet:
      id: 002-01-create-idempotency-keys
      author: credit-platform
      changes:
        - createTable:
            tableName: idempotency_keys
            columns:
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: idempotency_keys
            baseColumnNames: application_id
            referencedTableName: credit_applications
            referencedColumnNames: id
            constraintName: fk_idempotency_keys_application
            onDelete: CASCADE