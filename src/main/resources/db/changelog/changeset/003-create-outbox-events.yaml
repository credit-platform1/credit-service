databaseChangeLog:
  - changeSet:
      id: 003-01-create-outbox-events
      author: credit-platform
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: correlation_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: retry_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: last_error
                  type: TEXT

        - createIndex:
            indexName: idx_outbox_status_created_at
            tableName: outbox_events
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

        - createIndex:
            indexName: idx_outbox_aggregate_id
            tableName: outbox_events
            columns:
              - column:
                  name: aggregate_id